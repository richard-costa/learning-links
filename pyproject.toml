[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-links"
version = "0.1.0"
description = "Capture learning encounters and rediscover recurring topics across study contexts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "uv>=0.9",
]

[project.scripts]
learning-links = "learning_links.cli:main"
learning-links-api = "learning_links.api:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
