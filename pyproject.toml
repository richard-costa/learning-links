[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-links"
version = "0.1.0"
description = "Build and visualize prerequisite and helpful relationships between topics for self-directed learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
learning-links = "learning_links.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
